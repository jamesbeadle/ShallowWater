<script>
const ns='http://www.w3.org/2000/svg';
let seed=11;const rand=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const add=(parent,tag,attrs)=>{const el=document.createElementNS(ns,tag);for(const k in attrs)el.setAttribute(k,attrs[k]);document.getElementById(parent).appendChild(el);return el};

for(let y=830,h=4;y<1000;y+=h*3.2,h+=2.2) add('sunBars','rect',{x:200,y,width:900,height:h});

let d='M -10 1050 L -10 900';
for(let x=-10;x<=1210;x+=14){const crown=860+Math.sin(x/90)*22+rand()*28-(x>480&&x<760?-30:0);d+=` Q ${x+7} ${crown-14} ${x+14} ${crown+rand()*10}`}
document.getElementById('trees').setAttribute('d',d+' L 1210 1050 Z');

for(let y=1056;y<1290;y+=7){const spread=(y-1040)*1.1+40;const w=spread*(0.25+rand()*.7);
  add('reflection','rect',{x:600-w/2+(rand()-.5)*spread*.6,y,width:w,height:2+rand()*3,opacity:Math.max(0,.8-(y-1056)/300)})}

for(let y=1004;y<1050;y+=12)for(let x=-10;x<1210;x+=34){const xs=x+(y%24?17:0);
  if(xs>415&&xs<785&&y>935)continue;add('bricks','line',{x1:xs,y1:y,x2:xs,y2:y+10})}

[[812,950,22],[790,912,30],[750,872,40],[700,830,52],[640,800,62]].forEach(([cx,cy,r])=>add('smoke','circle',{cx,cy,r}));

[[150,250],[190,236],[226,262],[1000,214],[1040,232]].forEach(([x,y])=>add('birds','path',{d:`M ${x-14} ${y} Q ${x-6} ${y-8} ${x} ${y} Q ${x+6} ${y-8} ${x+14} ${y} Q ${x+6} ${y-4} ${x} ${y+3} Q ${x-6} ${y-4} ${x-14} ${y} Z`}));

const chainY=x=>1108+0.00042*(x-600)**2;
for(let x=-40,i=0;x<1240;x+=34,i++){const y=chainY(x),a=Math.atan((chainY(x+1)-y))*180/Math.PI;
  add('chain','ellipse',{cx:x,cy:y+60,rx:i%2?20:21,ry:i%2?5:11,fill:'none',stroke:'#0e0203','stroke-width':i%2?8:7,transform:`rotate(${a} ${x} ${y+60})`});
  if(i%2==0)add('chain','ellipse',{cx:x,cy:y+57,rx:17,ry:6,fill:'none',stroke:'#e8833a','stroke-width':1.5,opacity:.5,transform:`rotate(${a} ${x} ${y+60})`})}
add('chain','path',{d:'M 578 1190 C 578 1156 622 1156 622 1190',fill:'none',stroke:'#0e0203','stroke-width':10});
add('chain','rect',{x:562,y:1186,width:76,height:64,rx:8,fill:'#0e0203'});
add('chain','rect',{x:566,y:1189,width:68,height:6,rx:3,fill:'#e8833a',opacity:.5});
add('chain','circle',{cx:600,cy:1214,r:7,fill:'#5a1a10'});
add('chain','rect',{x:597,y:1216,width:6,height:16,fill:'#5a1a10'});
</script>
