name: Run test suite

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run test suite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the audit's unit tests
        run: python3 -m unittest discover -s tools/refactor/audit/tests -t .
